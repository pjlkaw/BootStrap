<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .divContainer th, tbody td{
            width: 100px;
            background-color: rgb(0, 109, 54);
            text-align: center;
            color: white;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 5px;
            align-items: center;
        }
        #name{
            border-radius: 10px;
            border: none;
        }
    </style>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5 bg-dark rounded border border-secondary shadow p-3 mb-5 rounded">
    <div class="container p-3">
        <input id="name" class="p-2" type="text"id="input" placeholder="Nome" autocomplete="off" autofocus>
        <button onclick="btn()" id="btn" type="button" class="btn btn-secondary btn-sm">Adicionar</button>
    </div>
    
    <table  class="mainTable table border-secondary" >
        <thead class="table-light">
            <tr>
                <th class="text-center border bg-secondary">#</th>
                <th class="border">Nome</th>
                <th class="border" colspan="2">Número aleatório</th>
            </tr>
        </thead>
        <tbody>
            <!-- Conteúdo -->
        </tbody>
        <tfoot>
            <tr>
                <td id="footer" style="display: none;" class="text-center p-2 transition-fade" colspan="10">Tabela Atualizada</td>
            </tr>
        </tfoot>
    </table>
    <table id="mainTable" class="divContainer" style="display: none">
        <thead>
            <tr>
                <th class="border 1" colspan="2">1</th>
                <th class="border">3</th>
                <th class="border">4</th>
                <th class="border">5</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="border">2</td>
                <td class="border">2</td>
                <td class="border">3</td>
                <td class="border" colspan="2" rowspan="2">4</td>
                <!-- <td class="border">5</td> -->
            </tr>
            <tr>
                <td class="border">3</td>
                <td class="border">2</td>
                <td class="border" rowspan="2">3</td>
                <!-- <td class="border">4</td> -->
                <!-- <td class="border">5</td> -->
            </tr>
            <tr>
                <td class="border" colspan="2">4</td>
                <td class="border" colspan="2">1</td>
            </tr>
            <tr>
                <td colspan="4" class="border" style="height: 40px;">4</td>
                <td class="border">5</td>
            </tr>
        </tbody>
    </table>

    
    
    <script src="script.js"></script>

</body>
</html>
